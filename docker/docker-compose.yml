services:
  web:
    image: ghcr.io/thevajko/vaii-web-server:8.3
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
    volumes:
      - ./../:/var/www/html/
    ports:
      - "127.0.0.1:80:80"
    stdin_open: true
    tty: true
    depends_on:
      - db
  db:
    image: mariadb:11.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_slovak_ci"]
    volumes:
      # skripty z tohto priečinka sa spustia iba pri prvom štarte (kým je zväzok db-data prázdny)
      - ./sql:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
  adminer:
    depends_on:
      - db
    image: adminer
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db

volumes:
  db-data:
